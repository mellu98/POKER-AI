big_blind: 2
stack: 1000
table:
  site: golbet
  type: 9max
  hero_seat: 0
  max_seats: 9
vision:
  mode: screenshot
  site: golbet
  window_title: Poker
  template_dir: vision/templates_goldbet
  llm:
    enabled: true
    api_key: ""
    model: google/gemini-3.5-flash-lite
    position_model: google/gemini-3.5-flash-lite
    position_refresh_seconds: 30
    cooldown_seconds: 1.5
  jev:
    # Auditor di coerenza (text-only, /api/alpha/decisions): non blocca il loop,
    # gira in background e allega jev_audit allo stato. ~1.8s per check.
    enabled: false
    model: "typesafe/jev-1.13"
    check_interval_seconds: 10.0
  position: null
  nn:
    enabled: false
    rank_model_path: vision/models/card_rank_classifier.joblib
    suit_model_path: vision/models/card_suit_classifier.joblib
    confidence_threshold: 0.5
  yolo:
    enabled: false
    model_path: "vision/models/poker_yolo.pt"
    confidence_threshold: 0.5
    device: "auto"
    use_for_cards: true
    use_for_numbers: true
    use_for_button: true
    validation_mode: true
    inference_size: 640
    max_latency_ms: 300
  temporal:
    enabled: true
    window_size: 5
    agreement_threshold: 0.6
    min_samples: 3
  table_collection:
    output_dir: "captures/raw"
    window_title: "Poker"
    interval_seconds: 2.0
    max_screenshots: null
    skip_duplicates: true
  rois:
    hole: &id001
      - x: 0.454
        y: 0.665
        w: 0.045
        h: 0.085
        rel: true
      - x: 0.499
        y: 0.665
        w: 0.045
        h: 0.085
        rel: true
    board: &id002
      - x: 0.350
        y: 0.437
        w: 0.056
        h: 0.120
        rel: true
      - x: 0.413
        y: 0.437
        w: 0.056
        h: 0.120
        rel: true
      - x: 0.477
        y: 0.437
        w: 0.056
        h: 0.120
        rel: true
      - x: 0.540
        y: 0.437
        w: 0.056
        h: 0.120
        rel: true
      - x: 0.604
        y: 0.437
        w: 0.056
        h: 0.120
        rel: true
    pot: &id003
      x: 0.43
      y: 0.37
      w: 0.14
      h: 0.05
      rel: true
    to_call: &id004
      x: 0.80
      y: 0.88
      w: 0.075
      h: 0.05
      rel: true
    stack: &id005
      x: 0.45
      y: 0.79
      w: 0.10
      h: 0.025
      rel: true
    dealer: null
    dealer_button: &id006
      x: 0.455
      y: 0.275
      w: 0.04
      h: 0.05
      rel: true
