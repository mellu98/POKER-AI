<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Poker Live Assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --border: #e2e2e6;
    --border-strong: #c8c8cc;
    --text: #15171c;
    --muted: #6b7280;
    --muted-2: #9ca3af;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #b91c1c;
    --red-bg: #fee2e2;
    --yellow: #b45309;
    --yellow-bg: #fef3c7;
    --blue: #1d4ed8;
    --blue-bg: #dbeafe;
    --accent: #6d28d9;
    --accent-bg: #ede9fe;
    /* four-color deck: spades green, hearts red, diamonds blue, clubs black */
    --suit-s: #1f7a2c;
    --suit-h: #c1272d;
    --suit-d: #1565c0;
    --suit-c: #1a1a1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    padding: 8px 8px 120px; /* bottom space for sticky verdict */
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  h2 {
    font-size: 11px; margin: 0 0 6px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); font-weight: 600;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 8px;
  }
  header .badge {
    font-size: 11px; color: var(--muted); padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 4px;
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; margin-bottom: 8px;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row.tight { gap: 4px; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 auto; }

  /* Buttons / pills */
  .pill, .btn {
    padding: 7px 11px; border: 1px solid var(--border-strong); background: #fff;
    border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 13px;
    user-select: none; min-height: 34px; color: var(--text);
    transition: background 0.05s, transform 0.05s;
  }
  .pill:hover, .btn:hover { background: var(--panel-2); }
  .pill:active, .btn:active { transform: scale(0.97); }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill.muted { color: var(--muted); border-style: dashed; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); border-radius: 8px; }
  .btn.danger { color: var(--red); border-color: var(--red); border-radius: 8px; }
  .btn.subtle { background: transparent; border-color: var(--border); border-radius: 6px; padding: 5px 9px; font-size: 12px; min-height: 28px; }

  input[type="number"], input[type="text"] {
    padding: 6px 8px; font-size: 14px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: #fff;
  }
  input[type="number"] { width: 64px; -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  label.with-input {
    display: inline-flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }

  /* Card grid */
  .card-grid {
    display: grid; grid-template-columns: repeat(13, 1fr);
    gap: 3px; user-select: none;
  }
  .card {
    aspect-ratio: 5 / 7; min-height: 40px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    border: 1px solid var(--border); border-radius: 5px;
    background: #fff; cursor: pointer;
    font-weight: 700; font-size: 13px; line-height: 1;
    transition: transform 0.06s ease;
  }
  .card .rank { font-size: 14px; }
  .card .suit { font-size: 13px; margin-top: 1px; }
  .card.suit-s { color: var(--suit-s); }
  .card.suit-h { color: var(--suit-h); }
  .card.suit-d { color: var(--suit-d); }
  .card.suit-c { color: var(--suit-c); }
  .card.selected-hole {
    background: #fff8d6; border-color: #b45309;
    box-shadow: inset 0 0 0 2px #b45309;
  }
  .card.selected-board {
    background: #dbeafe; border-color: #1d4ed8;
    box-shadow: inset 0 0 0 2px #1d4ed8;
  }
  .card.dimmed { opacity: 0.18; }
  .card.shake { animation: shake 0.25s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* Mode toggle */
  .mode {
    display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px;
    overflow: hidden;
  }
  .mode button {
    border: 0; padding: 7px 12px; cursor: pointer; background: #fff;
    font-size: 13px; font-weight: 600; color: var(--text);
    min-height: 34px;
  }
  .mode button.active.hole { background: #b45309; color: #fff; }
  .mode button.active.board { background: #1d4ed8; color: #fff; }

  /* Selection display */
  .sel-display { display: flex; gap: 5px; align-items: center; }
  .mini-card {
    display: inline-flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 3px 6px; border: 1px solid var(--border-strong);
    border-radius: 5px; font-weight: 700; min-width: 28px; min-height: 38px;
    line-height: 1; background: #fff; cursor: pointer;
  }
  .mini-card.empty { color: var(--muted-2); font-weight: 400; background: var(--panel-2); border-style: dashed; cursor: default; }
  .mini-card.suit-s { color: var(--suit-s); }
  .mini-card.suit-h { color: var(--suit-h); }
  .mini-card.suit-d { color: var(--suit-d); }
  .mini-card.suit-c { color: var(--suit-c); }
  .mini-card .suit { font-size: 14px; margin-top: 2px; }

  /* Action history bar */
  .action-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
  .action-buttons .btn { font-size: 12px; padding: 5px 9px; min-height: 28px; }
  .action-buttons .btn.adder { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

  .pot-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .pot-row label { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  /* Postflop context */
  .checkbox-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid var(--border-strong);
    border-radius: 8px; cursor: pointer; font-size: 13px; user-select: none;
    background: #fff;
  }
  .checkbox-pill.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .checkbox-pill input { accent-color: var(--blue); }

  .range-presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .range-presets .pill { font-size: 12px; padding: 5px 9px; min-height: 28px; }

  /* Sticky result */
  .sticky-result {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--panel); border-top: 1px solid var(--border-strong);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    padding: 10px 12px max(12px, env(safe-area-inset-bottom));
  }
  .sticky-result.r-green { background: #f0fdf4; border-top-color: var(--green); }
  .sticky-result.r-red { background: #fef2f2; border-top-color: var(--red); }
  .sticky-result.r-yellow { background: #fffbeb; border-top-color: var(--yellow); }

  .verdict-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .verdict {
    font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1;
  }
  .verdict.v-green { color: var(--green); }
  .verdict.v-red { color: var(--red); }
  .verdict.v-yellow { color: var(--yellow); }
  .verdict-meta { font-size: 13px; color: var(--muted); }
  .verdict-meta strong { color: var(--text); }
  .reasoning { font-size: 13px; color: var(--text); margin: 4px 0 0; }
  .recap-cards { display: inline-flex; gap: 3px; vertical-align: middle; }
  .recap-cards .mini-card { min-width: 22px; min-height: 28px; padding: 2px 4px; font-size: 11px; }
  .recap-cards .mini-card .suit { font-size: 12px; margin-top: 1px; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 6px; margin-top: 8px;
  }
  .stat {
    background: rgba(255,255,255,0.7); border-radius: 6px;
    padding: 5px 8px; border: 1px solid rgba(0,0,0,0.05);
  }
  .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .stat .value { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .stat .sub { font-size: 10px; color: var(--muted); }

  .empty-state { text-align: center; color: var(--muted); padding: 6px 0; }

  /* footer */
  .footer {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--muted); font-size: 11px; padding: 4px;
  }
  .footer .calc { display: inline-flex; align-items: center; gap: 4px; }
  .calc-spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 2px solid var(--muted-2); border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .help { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); top: 12px;
    background: rgba(15,23,42,0.92); color: #fff; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; z-index: 100; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; max-width: 90%;
  }
  .toast.show { opacity: 1; }

  details { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0; margin-bottom: 8px; }
  details summary { padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  details summary::after { content: '▾'; color: var(--muted); transition: transform 0.15s; }
  details[open] summary::after { transform: rotate(180deg); }
  details > div { padding: 0 12px 12px; }

  /* small screens */
  @media (max-width: 480px) {
    .card { min-height: 36px; font-size: 12px; }
    .card .rank { font-size: 12px; }
    .card .suit { font-size: 11px; }
    .verdict { font-size: 22px; }
    body { padding-bottom: 140px; }
  }
  @media (max-width: 360px) {
    .card-grid { gap: 2px; }
    .card { min-height: 32px; font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <h1>Poker Live Assistant</h1>
  <span class="badge">NLHE 6-max · v2</span>
</header>

<!-- ========== Position + table setup ========== -->
<div class="panel">
  <div class="row" style="justify-content: space-between; align-items: flex-start;">
    <div class="grow">
      <h2>Я на позиции</h2>
      <div id="hero-positions" class="row tight"></div>
    </div>
    <div>
      <h2>Игроков за столом</h2>
      <div id="format-toggle" class="row tight">
        <button class="pill" data-fmt="2">HU</button>
        <button class="pill active" data-fmt="6">6-max</button>
        <button class="pill" data-fmt="9">9-max</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== Preflop action history ========== -->
<div class="panel">
  <h2>Что было до меня <span style="text-transform:none;color:var(--muted-2);font-weight:400;letter-spacing:0;">(тапни кнопку — пот пересчитается)</span></h2>
  <div class="action-buttons" id="action-buttons">
    <button class="btn adder" data-act="limp">+ limp 1bb</button>
    <button class="btn adder" data-act="raise2_5">+ raise 2.5bb</button>
    <button class="btn adder" data-act="raise3">+ raise 3bb</button>
    <button class="btn adder" data-act="raise4">+ raise 4bb</button>
    <button class="btn adder" data-act="3bet9">+ 3bet 9bb</button>
    <button class="btn adder" data-act="3bet12">+ 3bet 12bb</button>
    <button class="btn adder" data-act="call">+ call</button>
    <button class="btn subtle" data-act="undo">↶ undo</button>
    <button class="btn subtle" data-act="reset">очистить</button>
  </div>
  <div id="action-history" class="help" style="margin-top:6px;min-height:14px;"></div>
  <div class="pot-row" style="margin-top: 8px;">
    <label>Pot, bb<input id="pot" type="number" value="1.5" min="0" max="500" step="0.5"></label>
    <label>To call, bb<input id="tocall" type="number" value="0" min="0" max="500" step="0.5"></label>
    <label>Eff stack, bb<input id="stack" type="number" value="100" min="5" max="500" step="5"></label>
    <label>Опп позиция<select id="opener-pos" style="padding:5px;border-radius:6px;border:1px solid var(--border-strong);font-size:13px;height:34px;">
      <option value="">—</option>
      <option value="UTG">UTG</option>
      <option value="MP">MP</option>
      <option value="CO">CO</option>
      <option value="BTN">BTN</option>
      <option value="SB">SB</option>
    </select></label>
  </div>
</div>

<!-- ========== Cards picker ========== -->
<div class="panel">
  <div class="row" style="justify-content: space-between;">
    <div class="mode">
      <button id="mode-hole" class="active hole" data-mode="hole">Свои (2)</button>
      <button id="mode-board" data-mode="board">Борд</button>
    </div>
    <div class="row tight">
      <button class="btn subtle" id="next-street">Next street →</button>
      <button class="btn subtle danger" id="reset-hand">Reset hand</button>
    </div>
  </div>

  <div class="row" style="margin: 10px 0 8px; gap:14px;">
    <div>
      <h2>Hole</h2>
      <div class="sel-display" id="hole-display"></div>
    </div>
    <div class="grow">
      <h2>Board</h2>
      <div class="sel-display" id="board-display"></div>
    </div>
  </div>

  <div class="card-grid" id="grid"></div>
</div>

<!-- ========== Postflop context (collapsible) ========== -->
<details id="postflop-context-panel">
  <summary>Контекст постфлопа <span id="postflop-summary" class="badge" style="margin-left:auto;">не задан</span></summary>
  <div>
    <div class="row" style="margin-bottom: 8px;">
      <label class="checkbox-pill">
        <input type="checkbox" id="is-pfa"> Я был preflop aggressor
      </label>
      <label class="checkbox-pill">
        <input type="checkbox" id="is-ip"> Я в позиции (IP)
      </label>
    </div>
    <h2>Диапазон оппонента</h2>
    <div id="range-presets" class="range-presets">
      <button class="pill active" data-range="random">Random (всё)</button>
      <button class="pill" data-range="loose">Loose recreational</button>
      <button class="pill" data-range="tight_caller">Tight call</button>
      <button class="pill" data-range="bb_defend">BB defend</button>
      <button class="pill" data-range="vs_3bet">After 3-bet (tight)</button>
      <button class="pill" data-range="utg_open">UTG open range</button>
      <button class="pill" data-range="btn_open">BTN open range</button>
    </div>
    <div id="range-info" class="help" style="margin-top:6px;"></div>
  </div>
</details>

<!-- ========== Result (sticky bottom) ========== -->
<div id="result-wrap" class="sticky-result">
  <div class="empty-state">Выбери 2 свои карты ↑</div>
</div>

<div class="footer">
  <span id="status" class="calc"></span>
  <span class="grow"></span>
  <span>MC: <input id="iters" type="number" value="2500" min="500" max="20000" step="500" style="width:70px;"></span>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ============== POKER LIVE ASSISTANT v2 — JS CORE ===========
   ============================================================ */

const RANKS = '23456789TJQKA';
const SUITS = ['s', 'h', 'd', 'c'];
const SUIT_GLYPH = { s: '♠', h: '♥', d: '♦', c: '♣' };
const SUIT_INDEX = { s: 0, h: 1, d: 2, c: 3 };
const POSITIONS_6MAX = ['UTG', 'MP', 'CO', 'BTN', 'SB', 'BB'];
const POSITIONS_HU = ['BTN', 'BB'];
const POSITIONS_9MAX = ['UTG', 'UTG1', 'UTG2', 'MP', 'MP1', 'CO', 'BTN', 'SB', 'BB'];

/* ---------- Card encoding ---------- */
function cardCodeToInt(code) {
  return RANKS.indexOf(code[0].toUpperCase()) * 4 + SUIT_INDEX[code[1].toLowerCase()];
}
function cardIntToCode(n) { return RANKS[n >> 2] + SUITS[n & 3]; }
function cardIntRank(n) { return n >> 2; }
function cardIntSuit(n) { return n & 3; }

/* ---------- 5-card hand evaluator ---------- */
function evaluate5(cards) {
  const ranks = [
    cardIntRank(cards[0]), cardIntRank(cards[1]), cardIntRank(cards[2]),
    cardIntRank(cards[3]), cardIntRank(cards[4])
  ];
  ranks.sort((a, b) => b - a);
  const sameSuit = (cardIntSuit(cards[0]) === cardIntSuit(cards[1])) &&
                   (cardIntSuit(cards[1]) === cardIntSuit(cards[2])) &&
                   (cardIntSuit(cards[2]) === cardIntSuit(cards[3])) &&
                   (cardIntSuit(cards[3]) === cardIntSuit(cards[4]));
  const cnt = new Array(13).fill(0);
  cnt[ranks[0]]++; cnt[ranks[1]]++; cnt[ranks[2]]++; cnt[ranks[3]]++; cnt[ranks[4]]++;
  const cr = [];
  for (let r = 12; r >= 0; r--) if (cnt[r]) cr.push([cnt[r], r]);
  cr.sort((a, b) => b[0] - a[0] || b[1] - a[1]);

  let st = -1;
  if (cr.length === 5 && ranks[0] - ranks[4] === 4) st = ranks[0];
  if (ranks[0] === 12 && ranks[1] === 3 && ranks[2] === 2 && ranks[3] === 1 && ranks[4] === 0) st = 3;

  if (sameSuit && st >= 0) return 8e9 + st;
  if (cr[0][0] === 4) return 7e9 + cr[0][1] * 13 + cr[1][1];
  if (cr[0][0] === 3 && cr[1][0] === 2) return 6e9 + cr[0][1] * 13 + cr[1][1];
  if (sameSuit) return 5e9 + (((ranks[0]*13 + ranks[1])*13 + ranks[2])*13 + ranks[3])*13 + ranks[4];
  if (st >= 0) return 4e9 + st;
  if (cr[0][0] === 3) return 3e9 + cr[0][1] * 169 + cr[1][1] * 13 + cr[2][1];
  if (cr[0][0] === 2 && cr[1][0] === 2) return 2e9 + cr[0][1] * 169 + cr[1][1] * 13 + cr[2][1];
  if (cr[0][0] === 2) return 1e9 + cr[0][1] * 2197 + cr[1][1] * 169 + cr[2][1] * 13 + cr[3][1];
  return (((ranks[0]*13 + ranks[1])*13 + ranks[2])*13 + ranks[3])*13 + ranks[4];
}

const COMBOS_7_5 = (() => {
  const out = [];
  for (let a = 0; a < 7; a++) for (let b = a+1; b < 7; b++) for (let c = b+1; c < 7; c++)
    for (let d = c+1; d < 7; d++) for (let e = d+1; e < 7; e++) out.push([a,b,c,d,e]);
  return out;
})();

function evaluate7(cards) {
  let best = -1;
  const tmp = new Array(5);
  for (let i = 0; i < 21; i++) {
    const idx = COMBOS_7_5[i];
    tmp[0]=cards[idx[0]]; tmp[1]=cards[idx[1]]; tmp[2]=cards[idx[2]]; tmp[3]=cards[idx[3]]; tmp[4]=cards[idx[4]];
    const s = evaluate5(tmp);
    if (s > best) best = s;
  }
  return best;
}

/* ---------- Hand notation ---------- */
function handCode(c1, c2) {
  const r1 = cardIntRank(c1), r2 = cardIntRank(c2);
  const s1 = cardIntSuit(c1), s2 = cardIntSuit(c2);
  const hi = Math.max(r1, r2), lo = Math.min(r1, r2);
  if (hi === lo) return RANKS[hi] + RANKS[lo];
  return RANKS[hi] + RANKS[lo] + (s1 === s2 ? 's' : 'o');
}

/* ---------- Range expansion ----------
   Take a Set of hand codes ('AKs', 'TT', 'AKo') → array of [int, int] combos,
   excluding any combo that uses a dead card (e.g. hero's hole or the board). */
function expandRange(handSet, deadCards) {
  const dead = new Set(deadCards);
  const combos = [];
  for (const h of handSet) {
    if (h.length === 2) {
      // pair AA/KK/.../22 — 6 combos
      const r = RANKS.indexOf(h[0]);
      for (let s1 = 0; s1 < 4; s1++)
        for (let s2 = s1+1; s2 < 4; s2++) {
          const c1 = r*4 + s1, c2 = r*4 + s2;
          if (!dead.has(c1) && !dead.has(c2)) combos.push([c1, c2]);
        }
    } else if (h.endsWith('s')) {
      // suited — 4 combos
      const r1 = RANKS.indexOf(h[0]), r2 = RANKS.indexOf(h[1]);
      for (let s = 0; s < 4; s++) {
        const c1 = r1*4 + s, c2 = r2*4 + s;
        if (!dead.has(c1) && !dead.has(c2)) combos.push([c1, c2]);
      }
    } else {
      // offsuit — 12 combos
      const r1 = RANKS.indexOf(h[0]), r2 = RANKS.indexOf(h[1]);
      for (let s1 = 0; s1 < 4; s1++)
        for (let s2 = 0; s2 < 4; s2++)
          if (s1 !== s2) {
            const c1 = r1*4 + s1, c2 = r2*4 + s2;
            if (!dead.has(c1) && !dead.has(c2)) combos.push([c1, c2]);
          }
    }
  }
  return combos;
}

/* ---------- Equity vs random (heads-up special case for speed) ---------- */
function equityVsRandom(holeInts, boardInts, nOpponents, iterations) {
  const used = new Set([...holeInts, ...boardInts]);
  const pool = [];
  for (let i = 0; i < 52; i++) if (!used.has(i)) pool.push(i);
  let wins = 0, ties = 0;
  const need = 2 * nOpponents + (5 - boardInts.length);
  const fb = new Array(5), h7 = new Array(7), v7 = new Array(7);

  for (let iter = 0; iter < iterations; iter++) {
    // partial Fisher-Yates: only the first `need` slots
    for (let i = 0; i < need; i++) {
      const j = i + ((Math.random() * (pool.length - i)) | 0);
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    let idx = 0;
    for (let k = 0; k < 5; k++) fb[k] = k < boardInts.length ? boardInts[k] : pool[idx++];
    h7[0] = holeInts[0]; h7[1] = holeInts[1];
    for (let k = 0; k < 5; k++) h7[2+k] = fb[k];
    const hs = evaluate7(h7);
    let bv = -1;
    for (let v = 0; v < nOpponents; v++) {
      v7[0] = pool[idx++]; v7[1] = pool[idx++];
      for (let k = 0; k < 5; k++) v7[2+k] = fb[k];
      const sc = evaluate7(v7); if (sc > bv) bv = sc;
    }
    if (hs > bv) wins++; else if (hs === bv) ties++;
  }
  return {
    win: wins / iterations, tie: ties / iterations,
    lose: (iterations - wins - ties) / iterations,
    equity: wins / iterations + (ties / iterations) / (nOpponents + 1)
  };
}

/* ---------- Equity vs range (single villain, heads-up) ---------- */
function equityVsRange(holeInts, boardInts, rangeCombos, iterations) {
  if (!rangeCombos || rangeCombos.length === 0) {
    // fall back to random
    return equityVsRandom(holeInts, boardInts, 1, iterations);
  }
  const used = new Set([...holeInts, ...boardInts]);
  // pre-filter combos that don't conflict with hero+board
  const valid = rangeCombos.filter(([a,b]) => !used.has(a) && !used.has(b));
  if (valid.length === 0) return equityVsRandom(holeInts, boardInts, 1, iterations);

  let wins = 0, ties = 0, valid_iters = 0;
  const fb = new Array(5), h7 = new Array(7), v7 = new Array(7);
  // pool of cards not in hero/board (used to complete board)
  const basePool = [];
  for (let i = 0; i < 52; i++) if (!used.has(i)) basePool.push(i);

  for (let iter = 0; iter < iterations; iter++) {
    // pick villain hand from valid range
    const vh = valid[(Math.random() * valid.length) | 0];
    const villainHole = [vh[0], vh[1]];
    // build pool for board completion: basePool minus villain's hole
    // (avoid full filter: just check during sampling)
    const need = 5 - boardInts.length;
    if (need > 0) {
      // sample `need` cards not in [hero+board+villain]
      const drawn = [];
      // partial shuffle approach on basePool with rejection
      // simple approach: rejection sampling — fast since basePool ~48 cards
      while (drawn.length < need) {
        const k = (Math.random() * basePool.length) | 0;
        const c = basePool[k];
        if (c === villainHole[0] || c === villainHole[1]) continue;
        if (drawn.indexOf(c) !== -1) continue;
        drawn.push(c);
      }
      for (let k = 0; k < 5; k++) fb[k] = k < boardInts.length ? boardInts[k] : drawn[k - boardInts.length];
    } else {
      for (let k = 0; k < 5; k++) fb[k] = boardInts[k];
    }
    h7[0] = holeInts[0]; h7[1] = holeInts[1];
    v7[0] = villainHole[0]; v7[1] = villainHole[1];
    for (let k = 0; k < 5; k++) { h7[2+k] = fb[k]; v7[2+k] = fb[k]; }
    const hs = evaluate7(h7);
    const vs = evaluate7(v7);
    if (hs > vs) wins++; else if (hs === vs) ties++;
    valid_iters++;
  }
  return {
    win: wins / valid_iters, tie: ties / valid_iters,
    lose: (valid_iters - wins - ties) / valid_iters,
    equity: wins / valid_iters + (ties / valid_iters) / 2,
    rangeSize: valid.length
  };
}

function rangeForFormat(format, position) {

  const code = handCode(c1, c2);
  // Special case: BB vs BTN open
  if (position === 'BB' && openerPos === 'BTN') {
    if (BB_DEFEND_VS_BTN_3BET.has(code)) return { action: '3-BET', tier: 'value+bluff' };
    if (BB_DEFEND_VS_BTN_CALL.has(code)) return { action: 'CALL', tier: 'defend' };

/* Detect draws on the board.
   Returns { fdOuts, sdOuts (straight outs), pairOuts, totalOuts, kind: string[] } */
function detectDraws(holeInts, boardInts) {
  if (boardInts.length < 3 || boardInts.length > 4) return { totalOuts: 0, kind: [] };

  const all = [...holeInts, ...boardInts];
  const ranks = all.map(cardIntRank);
  const suits = all.map(cardIntSuit);

  const kind = [];
  let totalOuts = 0;

  // -- Flush draw: 4 cards same suit (and you have 1 or 2 in your hand)
  const suitCount = [0,0,0,0];
  suits.forEach(s => suitCount[s]++);
  let fdSuit = -1;
  for (let s = 0; s < 4; s++) {
    if (suitCount[s] === 4) {
      // are at least one of hero's cards this suit?
      const heroSuits = holeInts.map(cardIntSuit);
      if (heroSuits.includes(s)) { fdSuit = s; break; }
    }
  }
  if (fdSuit >= 0) {
    totalOuts += 9;
    kind.push('FD (9 outs)');
  }
  // -- Backdoor flush draw (3 cards same suit on flop, 2 in hand+1 board e.g.)
  // skip — too speculative for live tool

  // -- Straight draw: enumerate which ranks would complete a straight
  const rankSet = new Set(ranks);
  const straightOuts = new Set();
  for (let r = 0; r < 13; r++) {
    if (rankSet.has(r)) continue;
    // try adding r and check if there's a 5-card straight in (rankSet U {r})
    const test = new Set(rankSet); test.add(r);
    if (hasStraightInRanks(test)) straightOuts.add(r);
  }
  // outs = number of distinct ranks * 4 suits (minus fd outs already counted to avoid double, but for simplicity show separately)
  if (straightOuts.size > 0) {
    // each rank has up to 4 cards in deck; subtract any visible
    let so = 0;
    for (const r of straightOuts) {
      let avail = 4;
      for (const c of all) if (cardIntRank(c) === r) avail--;
      so += avail;
    }
    if (straightOuts.size === 1) kind.push('Gutshot (~' + so + ' outs)');
    else if (straightOuts.size === 2) kind.push('OESD (~' + so + ' outs)');
    else kind.push('Multi-way straight (~' + so + ' outs)');
    totalOuts += so;
  }

  // overcards (rough): count hole-card overcards above all board cards (only when no pair)
  const heroRanks = holeInts.map(cardIntRank);
  const boardRanks = boardInts.map(cardIntRank);
  const maxBoard = Math.max(...boardRanks);
  const overcards = heroRanks.filter(r => r > maxBoard);
  // Only count overcards if hero has no pair anywhere:
  // not pocket pair AND no rank-match with the board.
  const isPocketPair = heroRanks[0] === heroRanks[1];
  const noPair = !isPocketPair && !heroRanks.some(r => boardRanks.includes(r));
  if (noPair && overcards.length > 0) {
    const oc = overcards.length * 3; // 3 of each available (1 in hand)
    if (oc > 0) kind.push(overcards.length + ' overcards (~' + oc + ' outs to TP)');
    // NOTE: don't add to totalOuts since pairing is much weaker than flush/straight
  }

  return { totalOuts, kind };
}

function hasStraightInRanks(rankSet) {
  // check 5 consecutive ranks; also wheel A-2-3-4-5
  for (let lo = 0; lo <= 8; lo++) {
    if (rankSet.has(lo) && rankSet.has(lo+1) && rankSet.has(lo+2) && rankSet.has(lo+3) && rankSet.has(lo+4))
      return true;
  }
  if (rankSet.has(12) && rankSet.has(0) && rankSet.has(1) && rankSet.has(2) && rankSet.has(3))
    return true;
  return false;
}

/* Board texture: dry / semi-wet / wet / monotone */
function boardTexture(boardInts) {
  if (boardInts.length < 3) return null;
  const ranks = boardInts.map(cardIntRank);
  const suits = boardInts.map(cardIntSuit);

  const suitCount = [0,0,0,0];
  suits.forEach(s => suitCount[s]++);
  const maxSuit = Math.max(...suitCount);

  const sortedR = [...ranks].sort((a,b) => a - b);
  const span = sortedR[sortedR.length-1] - sortedR[0];
  const distinct = new Set(ranks).size;

  // monotone (3+ same suit on flop) — very wet
  if (maxSuit >= 3) return 'monotone';
  // paired board — different dynamic
  if (distinct < ranks.length) return 'paired';
  // 3-card straight possible (gap ≤ 4) AND two-tone
  if (boardInts.length >= 3 && span <= 4 && maxSuit >= 2) return 'wet';
  if (span <= 4) return 'semi-wet';
  if (maxSuit >= 2) return 'semi-wet';
  return 'dry';
}

/* SPR (stack-to-pot ratio) and commitment */
function sprCommitment(effStackBb, potBb) {
  if (potBb <= 0) return { spr: Infinity, level: 'deep' };
  const spr = effStackBb / potBb;
  let level;
  if (spr < 1) level = 'committed';
  else if (spr < 4) level = 'low';   // commit-with-TPTK territory
  else if (spr < 13) level = 'mid';
  else level = 'deep';
  return { spr, level };
}

function buildRangePreset(name) {
  switch (name) {
    case 'random':
      return null; // signals "use vsRandom"
    case 'loose':
      // typical recreational caller — too many hands
      return new Set([
        // any pair
        'AA','KK','QQ','JJ','TT','99','88','77','66','55','44','33','22',
        // any ace
        'AKs','AQs','AJs','ATs','A9s','A8s','A7s','A6s','A5s','A4s','A3s','A2s',
        'AKo','AQo','AJo','ATo','A9o','A8o','A7o','A6o','A5o','A4o','A3o','A2o',
        // any king
        'KQs','KJs','KTs','K9s','K8s','K7s','K6s','K5s','K4s','K3s','K2s',
        'KQo','KJo','KTo','K9o','K8o','K7o',
        // queens
        'QJs','QTs','Q9s','Q8s','Q7s','Q6s','QJo','QTo','Q9o',
        // jacks-low
        'JTs','J9s','J8s','J7s','JTo','J9o','J8o',
        // suited connectors and gappers
        'T9s','T8s','T7s','98s','97s','87s','86s','76s','75s','65s','54s'
      ]);
    case 'tight_caller':
      // someone who flat-called preflop — cards that flat OK
      return VS_TIGHT_OPEN_CALL;
    case 'bb_defend':
      return new Set([...BB_DEFEND_VS_BTN_CALL, ...BB_DEFEND_VS_BTN_3BET]);
    case 'vs_3bet':
      // someone who 3bet — very tight
      return VS_TIGHT_OPEN_3BET;
    case 'utg_open':
      return RFI.UTG;
    case 'btn_open':
      return RFI.BTN;
    default:
      return null;
  }
}

/* ============================================================
   ============== ADVISER (decision logic) ====================
   ============================================================ */

function advise(state) {
  const { hole, board, position, format, potBb, toCallBb, effStackBb,
          isPfa, isIp, openerPos, villainRangeName, iters, history } = state;
  const street = board.length === 0 ? 'preflop'
    : board.length === 3 ? 'flop'
    : board.length === 4 ? 'turn'
    : board.length === 5 ? 'river' : 'invalid';
  const code = handCode(hole[0], hole[1]);

  // ----- PREFLOP -----
  if (street === 'preflop') {
    const facingRaise = toCallBb > 1.0;
    if (!facingRaise) {
      // Unopened pot
      // Special: BB with no action → blinds are yours
      if (position === 'BB' && history && history.length === 0) {
        return {
          street, code,
          verdict: 'CHECK / WIN',
          size: 0, color: 'green',
          reasoning: 'Все сфолдили до тебя — блайнды твои. Если SB не фолдит, чек на флоп.',
          equity: null, potOdds: null
        };
      }
      const range = rangeForFormat(format, position);
      const inRange = range.has(code);
      const sizeBb = position === 'BTN' || position === 'SB' ? 2.5 : 3.0;
      const rangePct = (range.size > 0 ? rangeSizeCombos(range) / 1326 : 0);
      return {
        street, code,
        verdict: inRange ? 'RAISE' : 'FOLD',
        size: inRange ? sizeBb : 0,
        color: inRange ? 'green' : 'red',
        reasoning: inRange
          ? `RFI ${position} (${(rangePct*100).toFixed(0)}% от рук) — ${code} в диапазоне. Open ${sizeBb}bb.`
          : `RFI ${position} (${(rangePct*100).toFixed(0)}% от рук) — ${code} НЕ в диапазоне. Фолд.`,
        equity: null, potOdds: null
      };
    }
    // Facing raise (or 3bet)
    const fr = facingRaiseAdvice(position, openerPos, hole[0], hole[1]);
    let size = 0;
    if (fr.action === '3-BET') {
      // IP 3bet: ~3x; OOP: ~4x
      const ipMult = (position === 'BTN' || position === 'CO') ? 3 : 4;
      size = Math.max(toCallBb * ipMult, 9);
    }
    const color = fr.action === '3-BET' ? 'green' : fr.action === 'CALL' ? 'yellow' : 'red';
    const opString = openerPos ? `vs ${openerPos} open` : 'vs open (позиция оппа не указана)';
    return {
      street, code,
      verdict: fr.action,
      size, color,
      reasoning: `${opString}. ${code} → ${fr.action} (${fr.tier}).` +
        (fr.action === '3-BET' ? ` Размер ${size}bb.` : ''),
      equity: null,
      potOdds: toCallBb / (potBb + toCallBb)
    };
  }

  // ----- POSTFLOP -----
  let villainRange = null;
  if (villainRangeName && villainRangeName !== 'random') {
    const set = buildRangePreset(villainRangeName);
    if (set) villainRange = expandRange(set, [...hole, ...board]);
  }
  let eq;
  if (villainRange && villainRange.length > 0) {
    eq = equityVsRange(hole, board, villainRange, iters);
  } else {
    eq = equityVsRandom(hole, board, 1, iters);
  }

  const potOdds = toCallBb > 0 ? toCallBb / (potBb + toCallBb) : 0;
  const draws = detectDraws(hole, board);
  const texture = boardTexture(board);
  const { spr, level } = sprCommitment(effStackBb, potBb);

  // Decision
  let verdict, color, reasoning, size = 0;
  const equityPct = eq.equity * 100;
  const potOddsPct = potOdds * 100;

  if (toCallBb > 0) {
    // Facing a bet
    const margin = eq.equity - potOdds;
    const isStrong = eq.equity > 0.65;
    const isMarginal = margin > 0;
    const isDraw = draws.totalOuts >= 8;

    if (isStrong && level !== 'committed') {
      // raise for value
      verdict = 'RAISE for value';
      color = 'green';
      const raiseSize = Math.round((toCallBb * 2.7 + potBb * 0.5) * 10) / 10;
      size = raiseSize;
      reasoning = `Equity ${equityPct.toFixed(1)}% vs ${rangeName(villainRangeName)} — это value range. Raise to ${raiseSize}bb (~2.5x их bet).`;
    } else if (isStrong) {
      verdict = 'CALL/JAM';
      color = 'green';
      reasoning = `Сильная рука (${equityPct.toFixed(1)}%) и ты pot-committed (SPR ${spr.toFixed(1)}). Колл, при first chance — джем.`;
    } else if (isMarginal) {
      verdict = 'CALL';
      color = 'yellow';
      reasoning = `Equity ${equityPct.toFixed(1)}% > pot odds ${potOddsPct.toFixed(1)}% (margin +${(margin*100).toFixed(1)}%). +EV колл.`;
      if (isDraw) reasoning += ` У тебя ${draws.kind.join(', ')} — implied odds ещё лучше.`;
    } else if (isDraw && street !== 'river') {
      // direct pot odds insufficient but draws + implied may justify
      const need = potOdds;
      const drawEquity = (street === 'flop') ? draws.totalOuts * 4 / 100 : draws.totalOuts * 2 / 100;
      if (drawEquity >= need - 0.05) {
        verdict = 'CALL (draw)';
        color = 'yellow';
        reasoning = `Equity ${equityPct.toFixed(1)}% < pot odds ${potOddsPct.toFixed(1)}%, но у тебя ${draws.kind.join(', ')} ≈ ${(drawEquity*100).toFixed(0)}% к улучшению. Implied odds — call.`;
      } else {
        verdict = 'FOLD';
        color = 'red';
        reasoning = `Equity ${equityPct.toFixed(1)}% < pot odds ${potOddsPct.toFixed(1)}%. Даже с draws (${draws.kind.join(', ')}) не хватает.`;
      }
    } else {
      verdict = 'FOLD';
      color = 'red';
      reasoning = `Equity ${equityPct.toFixed(1)}% < pot odds ${potOddsPct.toFixed(1)}%. Margin ${(margin*100).toFixed(1)}%. Фолд.`;
    }
  } else {
    // No bet to face — bet/check
    const sizeS = Math.round(potBb * 0.33 * 10) / 10;
    const sizeM = Math.round(potBb * 0.66 * 10) / 10;
    const sizeL = Math.round(potBb * 1.0 * 10) / 10;

    if (eq.equity > 0.75) {
      verdict = 'BET ' + sizeM + 'bb';
      color = 'green';
      size = sizeM;
      reasoning = `Очень сильно (${equityPct.toFixed(1)}% vs ${rangeName(villainRangeName)}). Value bet 66% pot.`;
    } else if (eq.equity > 0.55) {
      // depends on PFA + IP
      if (isPfa) {
        verdict = 'BET ' + sizeS + 'bb (cbet)';
        color = 'green';
        size = sizeS;
        reasoning = `${equityPct.toFixed(1)}% equity, PFA, ${texture || '—'} board. Cbet small (33% pot).`;
      } else if (isIp) {
        verdict = 'BET ' + sizeS + 'bb (probe)';
        color = 'yellow';
        size = sizeS;
        reasoning = `${equityPct.toFixed(1)}% equity, IP но не PFA. Probe small ИЛИ check-back.`;
      } else {
        verdict = 'CHECK';
        color = 'yellow';
        reasoning = `${equityPct.toFixed(1)}% equity, OOP, не PFA — pot control, check.`;
      }
    } else if (draws.totalOuts >= 8 && street !== 'river') {
      verdict = 'CHECK or semi-bluff';
      color = 'yellow';
      size = sizeM;
      reasoning = `Слабая мейд (${equityPct.toFixed(1)}%), но draws: ${draws.kind.join(', ')}. Check/raise или semi-bluff bet ${sizeM}bb если IP.`;
    } else {
      verdict = isPfa ? 'CHECK or small bluff' : 'CHECK';
      color = 'yellow';
      reasoning = `Слабая (${equityPct.toFixed(1)}%). ${isPfa ? 'Cbet опционально на сухом борде, иначе чек.' : 'Чек.'}`;
    }
  }

  return {
    street, code, verdict, color, reasoning, size,
    equity: eq.equity, win: eq.win, tie: eq.tie, lose: eq.lose,
    potOdds, spr, sprLevel: level, draws, texture,
    rangeSize: eq.rangeSize || null
  };
}

function rangeName(name) {
  const map = {
    random: 'random', loose: 'loose рекреационного',
    tight_caller: 'tight caller', bb_defend: 'BB defense',
    vs_3bet: '3-bet range', utg_open: 'UTG open', btn_open: 'BTN open'
  };
  return map[name] || 'range';
}

function rangeSizeCombos(handSet) {
  let total = 0;
  for (const h of handSet) {
    if (h.length === 2) total += 6;
    else if (h.endsWith('s')) total += 4;
    else total += 12;
  }
  return total;
}

/* ============================================================
   ============== UI STATE ====================================
   ============================================================ */

const state = {
  hole: [], board: [], mode: 'hole',
  position: 'BTN', format: 6,
  stack: 100, pot: 1.5, toCall: 0, openerPos: '',
  isPfa: false, isIp: false,
  villainRangeName: 'random',
  iters: 2500,
  history: []
};

try {
  const saved = JSON.parse(localStorage.getItem('pa_state_v2') || 'null');
  if (saved) {
    Object.assign(state, {
      position: saved.position || state.position,
      format: saved.format || state.format,
      stack: saved.stack || state.stack,
      iters: saved.iters || state.iters,
      isPfa: !!saved.isPfa, isIp: !!saved.isIp,
      villainRangeName: saved.villainRangeName || 'random'
    });
  }
} catch {}

function persist() {
  localStorage.setItem('pa_state_v2', JSON.stringify({
    position: state.position, format: state.format, stack: state.stack,
    iters: state.iters, isPfa: state.isPfa, isIp: state.isIp,
    villainRangeName: state.villainRangeName
  }));
}

/* ============================================================
   ============== UI WIRING ===================================
   ============================================================ */

const $ = sel => document.querySelector(sel);

/* Toast */
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

/* Position pills */
function renderPositions() {
  const root = $('#hero-positions');
  root.innerHTML = '';
  const positions = state.format === 9 ? POSITIONS_9MAX
    : state.format === 2 ? POSITIONS_HU
    : POSITIONS_6MAX;
  if (!positions.includes(state.position)) {
    // Prefer BTN if available, else last in list
    state.position = positions.includes('BTN') ? 'BTN' : positions[positions.length - 1];
  }
  positions.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pill' + (p === state.position ? ' active' : '');
    b.textContent = p;
    b.onclick = () => { state.position = p; renderPositions(); persist(); recalc(); };
    root.appendChild(b);
  });
}

/* Format toggle */
$('#format-toggle').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  const fmt = parseInt(e.target.dataset.fmt, 10);
  state.format = fmt;
  [...$('#format-toggle').children].forEach(c => c.classList.toggle('active', parseInt(c.dataset.fmt) === fmt));
  renderPositions();
  persist();
  recalc();
});

/* Inputs */
const stackInput = $('#stack');
const potInput = $('#pot');
const tocallInput = $('#tocall');
const itersInput = $('#iters');
const openerSelect = $('#opener-pos');
stackInput.value = state.stack;
itersInput.value = state.iters;

['change', 'input'].forEach(ev => {
  stackInput.addEventListener(ev, () => { state.stack = +stackInput.value || 0; persist(); recalc(); });
  potInput.addEventListener(ev, () => { state.pot = +potInput.value || 0; recalc(); });
  tocallInput.addEventListener(ev, () => { state.toCall = +tocallInput.value || 0; recalc(); });
});
itersInput.addEventListener('change', () => { state.iters = +itersInput.value || 2500; persist(); recalc(); });
openerSelect.addEventListener('change', () => { state.openerPos = openerSelect.value; recalc(); });

/* Action buttons (preflop helper) */
$('#action-buttons').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  applyAction(act);
});

function applyAction(act) {
  if (act === 'reset') {
    state.history = []; state.pot = 1.5; state.toCall = 0; state.openerPos = '';
    syncActionUI(); renderHistory(); recalc();
    return;
  }
  if (act === 'undo') {
    state.history.pop();
    recomputePotFromHistory();
    syncActionUI(); renderHistory(); recalc();
    return;
  }
  // adders
  let label, addPot, newToCall;
  switch (act) {
    case 'limp': label = 'limp 1bb'; addPot = 1; newToCall = 1; break;
    case 'raise2_5': label = 'raise 2.5bb'; addPot = 2.5; newToCall = 2.5; break;
    case 'raise3': label = 'raise 3bb'; addPot = 3; newToCall = 3; break;
    case 'raise4': label = 'raise 4bb'; addPot = 4; newToCall = 4; break;
    case '3bet9': label = '3-bet 9bb'; addPot = 9; newToCall = 9; break;
    case '3bet12': label = '3-bet 12bb'; addPot = 12; newToCall = 12; break;
    case 'call':
      // call current bet
      label = 'call ' + state.toCall + 'bb'; addPot = state.toCall; newToCall = state.toCall;
      break;
    default: return;
  }
  state.history.push({ act, label, addPot, newToCall });
  state.pot = round1(state.pot + addPot);
  state.toCall = newToCall;
  syncActionUI(); renderHistory(); recalc();
}

function recomputePotFromHistory() {
  state.pot = 1.5; state.toCall = 0;
  for (const h of state.history) {
    state.pot = round1(state.pot + h.addPot);
    state.toCall = h.newToCall;
  }
}
function round1(x) { return Math.round(x * 10) / 10; }

function syncActionUI() {
  potInput.value = state.pot;
  tocallInput.value = state.toCall;
}
function renderHistory() {
  const lbl = state.history.map(h => h.label).join(' → ');
  $('#action-history').textContent = lbl ? '📋 ' + lbl : '';
}

/* Mode toggle */
const modeHole = $('#mode-hole'), modeBoard = $('#mode-board');
function setMode(m, silent) {
  state.mode = m;
  modeHole.classList.toggle('active', m === 'hole');
  modeHole.classList.toggle('hole', m === 'hole');
  modeBoard.classList.toggle('active', m === 'board');
  modeBoard.classList.toggle('board', m === 'board');
  if (!silent) toast(m === 'hole' ? 'Режим: свои карты' : 'Режим: борд');
}
modeHole.onclick = () => setMode('hole');
modeBoard.onclick = () => setMode('board');

/* Reset / Next street */
$('#reset-hand').onclick = () => {
  state.hole = []; state.board = []; state.history = [];
  state.pot = 1.5; state.toCall = 0; state.openerPos = '';
  openerSelect.value = '';
  setMode('hole', true);
  renderGrid(); renderSelections(); syncActionUI(); renderHistory(); recalc();
  toast('Новая раздача');
};
$('#next-street').onclick = () => {
  // helper: clear board only (keep hole, keep history if you want)
  // After call/raise, ready for next street
  if (state.board.length === 0) toast('Сначала введи флоп');
  else if (state.board.length < 5) {
    setMode('board', false);
    toast('Тапай следующую карту борда');
  } else toast('Раздача закрыта — Reset hand');
};

/* Card grid */
const grid = $('#grid');
function renderGrid() {
  grid.innerHTML = '';
  for (let s = 0; s < 4; s++) {
    for (let r = 0; r < 13; r++) {
      const cardInt = r * 4 + s;
      const el = document.createElement('div');
      el.className = 'card suit-' + SUITS[s];
      const isHole = state.hole.includes(cardInt);
      const isBoard = state.board.includes(cardInt);
      if (isHole) el.classList.add('selected-hole');
      if (isBoard) el.classList.add('selected-board');
      el.innerHTML = `<span class="rank">${RANKS[r]}</span><span class="suit">${SUIT_GLYPH[SUITS[s]]}</span>`;
      el.dataset.cardInt = cardInt;
      el.onclick = () => onCardClick(cardInt, el);
      grid.appendChild(el);
    }
  }
}

function onCardClick(cardInt, el) {
  const arr = state.mode === 'hole' ? state.hole : state.board;
  const otherArr = state.mode === 'hole' ? state.board : state.hole;
  const idx = arr.indexOf(cardInt);
  if (idx >= 0) {
    arr.splice(idx, 1);
    renderGrid(); renderSelections(); recalc();
    return;
  }
  if (otherArr.includes(cardInt)) {
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 250);
    toast('Эта карта уже в ' + (state.mode === 'hole' ? 'борде' : 'своих'));
    return;
  }
  const max = state.mode === 'hole' ? 2 : 5;
  if (arr.length >= max) {
    if (state.mode === 'hole') {
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 250);
      toast('У тебя уже 2 карты — тапни одну чтобы снять');
      return;
    } else {
      // board: replace oldest (announced)
      const removed = arr.shift();
      toast('Карта борда заменена');
    }
  }
  arr.push(cardInt);
  // auto-switch mode when hole filled
  if (state.mode === 'hole' && arr.length === 2) {
    setTimeout(() => setMode('board', false), 100);
  }
  renderGrid(); renderSelections(); recalc();
}

/* Selection display */
function makeMini(cardInt, removable=true) {
  const r = cardIntRank(cardInt), s = cardIntSuit(cardInt);
  const el = document.createElement('span');
  el.className = 'mini-card suit-' + SUITS[s];
  el.innerHTML = `${RANKS[r]}<span class="suit">${SUIT_GLYPH[SUITS[s]]}</span>`;
  if (removable) el.onclick = () => onCardClick(cardInt, null);
  return el;
}
function makeEmpty() {
  const el = document.createElement('span');
  el.className = 'mini-card empty';
  el.innerHTML = '·';
  return el;
}
function renderSelections() {
  const hd = $('#hole-display'); hd.innerHTML = '';
  for (let i = 0; i < 2; i++) hd.appendChild(state.hole[i] !== undefined ? makeMini(state.hole[i]) : makeEmpty());
  const bd = $('#board-display'); bd.innerHTML = '';
  const slots = Math.max(state.board.length, state.board.length === 0 ? 0 : 3);
  // show 5 placeholders if no board yet
  const display = state.board.length === 0 ? 5 : 5;
  for (let i = 0; i < display; i++) {
    if (i < state.board.length) bd.appendChild(makeMini(state.board[i]));
    else bd.appendChild(makeEmpty());
  }
}

/* Postflop context controls */
$('#is-pfa').addEventListener('change', e => {
  state.isPfa = e.target.checked;
  e.target.parentElement.classList.toggle('active', e.target.checked);
  persist(); recalc();
});
$('#is-ip').addEventListener('change', e => {
  state.isIp = e.target.checked;
  e.target.parentElement.classList.toggle('active', e.target.checked);
  persist(); recalc();
});
$('#is-pfa').checked = state.isPfa;
$('#is-pfa').parentElement.classList.toggle('active', state.isPfa);
$('#is-ip').checked = state.isIp;
$('#is-ip').parentElement.classList.toggle('active', state.isIp);

$('#range-presets').addEventListener('click', e => {
  const btn = e.target.closest('button[data-range]');
  if (!btn) return;
  state.villainRangeName = btn.dataset.range;
  [...$('#range-presets').children].forEach(c => c.classList.toggle('active', c === btn));
  const set = buildRangePreset(state.villainRangeName);
  $('#range-info').textContent = set
    ? `${set.size} hand-кодов = ${rangeSizeCombos(set)} комбо (${(rangeSizeCombos(set)/1326*100).toFixed(0)}% от всех)`
    : 'Случайная рука (без сужения).';
  persist(); recalc();
});
// pre-select saved range
[...$('#range-presets').children].forEach(c => c.classList.toggle('active', c.dataset.range === state.villainRangeName));

/* ============================================================
   ============== RECALC + RENDER RESULT ======================
   ============================================================ */

const resultWrap = $('#result-wrap');
const statusEl = $('#status');
let recalcTimer = null;

function recalc() {
  clearTimeout(recalcTimer);
  recalcTimer = setTimeout(doRecalc, 50);
}

function doRecalc() {
  // Auto-expand postflop context when board has cards (so user sees IP/PFA toggles)
  const postflopPanel = document.getElementById('postflop-context-panel');
  if (state.board.length >= 3 && !postflopPanel.open && !postflopPanel.dataset.userToggled) {
    postflopPanel.open = true;
  }
  // Update postflop summary badge
  const sum = document.getElementById('postflop-summary');
  if (sum) {
    const parts = [];
    parts.push(state.isPfa ? 'PFA' : 'не PFA');
    parts.push(state.isIp ? 'IP' : 'OOP');
    parts.push('vs ' + (rangeName(state.villainRangeName) || 'random'));
    sum.textContent = parts.join(' · ');
  }

  if (state.hole.length !== 2) {
    resultWrap.className = 'sticky-result';
    resultWrap.innerHTML = '<div class="empty-state">Выбери 2 свои карты ↑</div>';
    statusEl.innerHTML = '';
    adjustBodyPadding();
    return;
  }
  if (state.board.length !== 0 && (state.board.length < 3 || state.board.length > 5)) {
    resultWrap.className = 'sticky-result';
    resultWrap.innerHTML = `<div class="empty-state">Борд: 0/3/4/5 карт. Сейчас: ${state.board.length}.</div>`;
    statusEl.innerHTML = '';
    adjustBodyPadding();
    return;
  }

  statusEl.innerHTML = '<span class="calc-spinner"></span> считаю…';

  setTimeout(() => {
    const t0 = performance.now();
    const rec = advise({
      hole: state.hole.slice(), board: state.board.slice(),
      position: state.position, format: state.format,
      potBb: state.pot, toCallBb: state.toCall, effStackBb: state.stack,
      isPfa: state.isPfa, isIp: state.isIp, openerPos: state.openerPos,
      villainRangeName: state.villainRangeName, iters: state.iters,
      history: state.history
    });
    const ms = Math.round(performance.now() - t0);
    renderResult(rec);
    statusEl.textContent = ms + ' мс';
  }, 10);
}

function renderResult(rec) {
  resultWrap.className = 'sticky-result r-' + rec.color;
  const verdictClass = 'v-' + rec.color;

  // build cards recap
  const recapHole = state.hole.map(c => makeMini(c, false).outerHTML).join('');
  const recapBoard = state.board.map(c => makeMini(c, false).outerHTML).join('');
  const recap = `<span class="recap-cards">${recapHole}</span>` +
    (state.board.length ? ` <span style="color:var(--muted-2);">|</span> <span class="recap-cards">${recapBoard}</span>` : '');

  let stats = '';
  stats += `<div class="stat"><div class="label">Стрит</div><div class="value">${rec.street}</div></div>`;
  stats += `<div class="stat"><div class="label">Рука</div><div class="value">${rec.code}</div></div>`;
  if (rec.equity !== null && rec.equity !== undefined) {
    const sub = `W ${(rec.win*100).toFixed(0)} / T ${(rec.tie*100).toFixed(0)} / L ${(rec.lose*100).toFixed(0)}`;
    stats += `<div class="stat"><div class="label">Equity</div><div class="value">${(rec.equity*100).toFixed(1)}%</div><div class="sub">${sub}</div></div>`;
  }
  if (rec.potOdds && rec.potOdds > 0) {
    stats += `<div class="stat"><div class="label">Pot odds</div><div class="value">${(rec.potOdds*100).toFixed(1)}%</div></div>`;
  }
  if (rec.spr !== undefined && rec.spr !== Infinity && rec.street !== 'preflop') {
    stats += `<div class="stat"><div class="label">SPR</div><div class="value">${rec.spr.toFixed(1)}</div><div class="sub">${rec.sprLevel}</div></div>`;
  }
  if (rec.draws && rec.draws.totalOuts > 0) {
    const dEq = rec.street === 'flop' ? rec.draws.totalOuts * 4 : rec.draws.totalOuts * 2;
    stats += `<div class="stat"><div class="label">Outs</div><div class="value">${rec.draws.totalOuts}</div><div class="sub">≈${dEq}% к улучш.</div></div>`;
  }
  if (rec.texture) {
    stats += `<div class="stat"><div class="label">Texture</div><div class="value" style="font-size:13px;">${rec.texture}</div></div>`;
  }
  if (rec.size && rec.size > 0) {
    stats += `<div class="stat"><div class="label">Размер</div><div class="value">${rec.size.toFixed(1)} bb</div></div>`;
  }

  resultWrap.innerHTML = `
    <div class="verdict-row">
      <span class="verdict ${verdictClass}">${rec.verdict}</span>
      <span class="verdict-meta">${recap}</span>
    </div>
    <div class="reasoning">${rec.reasoning}</div>
    <div class="stat-grid">${stats}</div>
  `;
  adjustBodyPadding();
}

/* Resize body padding-bottom to match sticky result height */
function adjustBodyPadding() {
  requestAnimationFrame(() => {
    const h = resultWrap.offsetHeight || 100;
    document.body.style.paddingBottom = (h + 16) + 'px';
  });
}

// Track manual user toggle of postflop drawer (so we don't fight them)
document.getElementById('postflop-context-panel').addEventListener('toggle', e => {
  e.target.dataset.userToggled = '1';
});

/* ============================================================
   ============== KEYBOARD SHORTCUTS ==========================
   ============================================================ */

let kbBuffer = '';
let kbBufferTimer = null;
document.addEventListener('keydown', e => {
  // ignore if typing in input
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  const ranks = '23456789tjqka';
  const suits = 'shdc';

  // Suit completion has priority over mode toggle when buffer is filled
  if (suits.includes(k) && kbBuffer) {
    const code = kbBuffer + k;
    try {
      const cardInt = cardCodeToInt(code);
      const el = grid.querySelector(`[data-card-int="${cardInt}"]`);
      if (el) onCardClick(cardInt, el);
      toast(code.toUpperCase());
    } catch {}
    kbBuffer = '';
    clearTimeout(kbBufferTimer);
    return;
  }
  if (ranks.includes(k)) {
    kbBuffer = k.toUpperCase();
    clearTimeout(kbBufferTimer);
    kbBufferTimer = setTimeout(() => { kbBuffer = ''; }, 1500);
    return;
  }
  // Mode/utility shortcuts (only when no rank in buffer)
  if (!kbBuffer) {
    if (k === 'm') { setMode(state.mode === 'hole' ? 'board' : 'hole'); return; }
    if (k === 'r' && e.shiftKey) { $('#reset-hand').click(); return; }
    if (k === 'n') { $('#next-street').click(); return; }
  }
});

/* ============================================================
   ============== INITIAL RENDER ==============================
   ============================================================ */

renderPositions();
renderGrid();
renderSelections();
// init range info
const initSet = buildRangePreset(state.villainRangeName);
$('#range-info').textContent = initSet
  ? `${initSet.size} hand-кодов = ${rangeSizeCombos(initSet)} комбо (${(rangeSizeCombos(initSet)/1326*100).toFixed(0)}% от всех)`
  : 'Случайная рука (без сужения).';
recalc();

// expose for tests
window.__pa = { evaluate5, evaluate7, equityVsRandom, equityVsRange, expandRange,
  detectDraws, boardTexture, sprCommitment, advise, handCode, RFI, buildRangePreset,
  rangeSizeCombos, facingRaiseAdvice };
</script>
